spring.application.name=real-estate-dd-agent

# PostgreSQL
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/real_estate}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:ganesh}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}

# ===============================================
# External API Integration Configuration
# ===============================================
external.api.connect-timeout=${EXTERNAL_API_CONNECT_TIMEOUT:5s}
external.api.read-timeout=${EXTERNAL_API_READ_TIMEOUT:10s}

external.api.property.base-url=${EXTERNAL_PROPERTY_API_BASE_URL:}
external.api.property.api-key=${EXTERNAL_PROPERTY_API_KEY:}

external.api.geocoding.base-url=${EXTERNAL_GEOCODING_API_BASE_URL:}
external.api.geocoding.api-key=${EXTERNAL_GEOCODING_API_KEY:}

external.api.ownership.base-url=${EXTERNAL_OWNERSHIP_API_BASE_URL:}
external.api.ownership.api-key=${EXTERNAL_OWNERSHIP_API_KEY:}

external.api.tax.base-url=${EXTERNAL_TAX_API_BASE_URL:}
external.api.tax.api-key=${EXTERNAL_TAX_API_KEY:}

external.api.zoning.base-url=${EXTERNAL_ZONING_API_BASE_URL:}
external.api.zoning.api-key=${EXTERNAL_ZONING_API_KEY:}

external.api.flood.base-url=${EXTERNAL_FLOOD_API_BASE_URL:}
external.api.flood.api-key=${EXTERNAL_FLOOD_API_KEY:}

external.api.permit.base-url=${EXTERNAL_PERMIT_API_BASE_URL:}
external.api.permit.api-key=${EXTERNAL_PERMIT_API_KEY:}

external.api.environmental.base-url=${EXTERNAL_ENVIRONMENTAL_API_BASE_URL:}
external.api.environmental.api-key=${EXTERNAL_ENVIRONMENTAL_API_KEY:}

external.api.utility.base-url=${EXTERNAL_UTILITY_API_BASE_URL:}
external.api.utility.api-key=${EXTERNAL_UTILITY_API_KEY:}
# Redis Cache
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.cache.redis.time-to-live=600000

# Google OAuth 2.0
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Google OAuth provider
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# Frontend redirect after successful login
app.oauth2.redirect-uri=http://localhost:3000/login/success

# OAuth debugging logs
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.security.oauth2.client=TRACE
logging.level.org.springframework.security.oauth2.core=TRACE